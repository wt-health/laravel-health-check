name: 'Lint & Tests'
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  composer:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: dom, bcmath, curl, libxml, gettext, exif, iconv, intl, mbstring, gd, imagick, soap, sockets, zip, pcntl, pdo, mysql, pdo_mysql
          coverage: pcov
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Composer Install
        run: composer install
      - name: Tar files # to keep right permissions
        run: tar -cf vendor.tar vendor
      - name: Store artifacts
        uses: actions/upload-artifact@v7
        with:
          name: composer
          path: vendor.tar


  lint:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    needs: composer
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: dom, bcmath, curl, libxml, gettext, exif, iconv, intl, mbstring, gd, imagick, soap, sockets, zip, pcntl, pdo, mysql, pdo_mysql
          coverage: pcov
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: composer
      - name: UnTar files # to keep right permissions
        run: tar -xf vendor.tar vendor
      - name: PHP Coding Standards
        run: composer pint
      - name: PHPStan Static Analysis
        run: composer phpstan

  tests:
    name: Tests (PHP ${{ matrix.php }}, Laravel ${{ matrix.laravel }})
    timeout-minutes: 20
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        laravel: ['12', '13']
        include:
          - laravel: '12'
            testbench: '10'
          - laravel: '13'
            testbench: '11'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, bcmath, curl, libxml, gettext, exif, iconv, intl, mbstring, gd, imagick, soap, sockets, zip, pcntl, pdo, mysql, pdo_mysql
          coverage: pcov
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install dependencies (Laravel ${{ matrix.laravel }})
        # composer.lock isn't committed, so pin the matrix versions in composer.json and do a full update
        run: |
          composer require "illuminate/support:^${{ matrix.laravel }}.0" --no-update --no-interaction
          composer require --dev "orchestra/testbench:^${{ matrix.testbench }}.0" --no-update --no-interaction
          composer update --with-all-dependencies --prefer-dist --no-interaction --no-progress
      - name: PHP Unit Test
        run: ./vendor/bin/phpunit --coverage-clover=coverage.clover
      - name: Upload coverage reports to Codecov
        if: matrix.php == '8.4' && matrix.laravel == '13'
        uses: codecov/codecov-action@v5.5.2
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: wt-health/laravel-health-check
          files: ./coverage.clover

  # Branch protection requires a check named "test"; this reports the result of the whole matrix
  # so the required check doesn't change whenever the matrix does.
  test:
    if: always()
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Check matrix result
        run: test "${{ needs.tests.result }}" = "success"
